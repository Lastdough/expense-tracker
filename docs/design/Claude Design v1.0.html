<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef } = React;

// ─── Reference data (exact colors from CLAUDE.md) ─────────────────────────
const CATEGORIES = [
{ id: 'c1', name: 'Food', bg: '#ffcfc9', fg: '#b10202' },
{ id: 'c2', name: 'Transportations', bg: '#0a53a8', fg: '#ffffff' },
{ id: 'c3', name: 'Shopping', bg: '#e6cff2', fg: '#5a3286' },
{ id: 'c4', name: 'Supplies', bg: '#e6cff2', fg: '#5a3286' },
{ id: 'c5', name: 'Groceries', bg: '#e6cff2', fg: '#5a3286' },

{ id: 'c8', name: 'Entertainment', bg: '#ffe5a0', fg: '#473821' },
{ id: 'c9', name: 'Healthcare', bg: '#d4edbc', fg: '#11734b' },
{ id: 'c10', name: 'Misc', bg: '#e8eaed', fg: '#000000' }];

const METHODS = [
{ id: 'm1', name: 'Mandiri', bg: '#143361', fg: '#a8c0e0' },
{ id: 'm2', name: 'Jago', bg: '#fcaf23', fg: '#6b4400' },
{ id: 'm3', name: 'BCA', bg: '#046ebc', fg: '#c0d8f5' },
{ id: 'm4', name: 'Gopay', bg: '#00accb', fg: '#e0f7ff' },
{ id: 'm5', name: 'ShopeePay', bg: '#ef5334', fg: '#ffffff' },
{ id: 'm6', name: 'Cash', bg: '#e8eaed', fg: '#000000' }];

const STATUSES = [
{ id: 's1', name: 'Non-Reimbursable', short: 'Non-reimb', bg: '#e8eaed', fg: '#000000' },
{ id: 's2', name: 'Unpaid Reimbursable', short: 'Unpaid', bg: '#ffe5a0', fg: '#473821' },
{ id: 's3', name: 'Paid Reimbursable', short: 'Paid', bg: '#d4edbc', fg: '#11734b' },
{ id: 's4', name: 'Early Reimbursement', short: 'Early', bg: '#bce3f2', fg: '#0b4c6b' },

const fmtIDR = (n) => 'Rp ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');

// ─── Chip ────────────────────────────────────────────────────────────────
function Chip({ token, label, size = 'sm', className = '' }) {
  const sz = size === 'lg' ? 'text-sm px-3 py-1' : size === 'md' ? 'text-[12.5px] px-2.5 py-[3px]' : 'text-[11.5px] px-2 py-[2px]';
  return (
    <span className={'inline-flex items-center rounded-full font-medium leading-tight whitespace-nowrap ' + sz + ' ' + className}
    style={{ background: token.bg, color: token.fg, padding: "3px 10px" }}>
      {label ?? token.name}
    </span>);

}

// ─── Formula eval (display-only, mirrors the security rules) ─────────────
function evalFormula(raw) {
  if (!raw) return { ok: false, value: 0 };
  const expr = raw.startsWith('=') ? raw.slice(1) : raw;
  if (!/^[\d+\-*/().\s]*$/.test(expr)) return { ok: false, value: 0, err: 'invalid characters' };
  try {
    // eslint-disable-next-line no-new-func
    // Real app uses sandboxed parser — this preview just renders the resolved number.
    // Whitelist already enforced above; we'll do a tiny shunting-yard.
    return { ok: true, value: shuntingYard(expr) };
  } catch (e) {return { ok: false, value: 0, err: e.message };}
}
function shuntingYard(s) {
  const out = [],op = [],prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
  const tokens = s.match(/(\d+\.?\d*|[+\-*/()])/g) || [];
  for (const t of tokens) {
    if (/^\d/.test(t)) out.push(parseFloat(t));else
    if (t === '(') op.push(t);else
    if (t === ')') {while (op.length && op[op.length - 1] !== '(') out.push(op.pop());op.pop();} else
    {while (op.length && op[op.length - 1] !== '(' && prec[op[op.length - 1]] >= prec[t]) out.push(op.pop());op.push(t);}
  }
  while (op.length) out.push(op.pop());
  const st = [];
  for (const t of out) {
    if (typeof t === 'number') st.push(t);else
    {const b = st.pop(),a = st.pop();st.push(t === '+' ? a + b : t === '-' ? a - b : t === '*' ? a * b : a / b);}
  }
  return st[0] ?? 0;
}

// ─── Icons (inline SVGs — lucide style) ──────────────────────────────────
const I = {
  plus: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14" /></svg>,
  list: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>,
  chart: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18M7 16l4-4 4 4 6-8" /></svg>,
  receipt: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 2V2H4z" /><path d="M8 7h8M8 11h8M8 15h5" /></svg>,
  cog: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>,
  chev: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6" /></svg>,
  back: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6" /></svg>,
  del: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 4 8.4 8.4 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8z" /></svg>,
  cal: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></svg>,
  search: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></svg>,
  bell: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
};

// ─── Layout: device toggle ───────────────────────────────────────────────
function App() {
  const [device, setDevice] = useState('mobile'); // 'mobile' | 'desktop'
  const [route, setRoute] = useState('quick-add'); // mobile + desktop both use these route ids
  return (
    <div className="min-h-screen w-full p-6 bg-[#eeece5]">
      {/* Toolbar */}
      <div className="max-w-[1320px] mx-auto mb-5 flex items-center justify-between">
        <div>
          <h1 className="text-[20px] font-bold tracking-tight">Expense Tracker · Pass 1</h1>
          <p className="text-[12.5px] text-stone-600">Mid-fi prototype · {route} · {device}</p>
        </div>
        <div className="flex items-center gap-2">
          <div className="inline-flex rounded-full border border-stone-300 bg-white p-[3px]">
            {['mobile', 'desktop'].map((d) =>
            <button key={d} onClick={() => setDevice(d)}
            className={'px-3 py-1 text-[12px] rounded-full transition ' + (device === d ? 'bg-ink text-paper' : 'text-stone-600 hover:text-ink')}
            style={device === d ? { background: '#0a0908', color: '#fafaf7' } : {}}>
                {d}
              </button>
            )}
          </div>
        </div>
      </div>

      {/* Frame */}
      <div className="max-w-[1320px] mx-auto flex justify-center">
        {device === 'mobile' ?
        <MobileFrame route={route} setRoute={setRoute} /> :
        <DesktopFrame route={route} setRoute={setRoute} />}
      </div>
    </div>);

}

// ─── Mobile shell: bottom tabs ───────────────────────────────────────────
const MOBILE_TABS = [
{ id: 'quick-add', icon: I.plus, label: 'Add' },
{ id: 'expenses', icon: I.list, label: 'Expenses' },
{ id: 'dashboard', icon: I.chart, label: 'Insights' },
{ id: 'receipt', icon: I.receipt, label: 'Receipt' },
{ id: 'settings', icon: I.cog, label: 'Settings' }];


function MobileFrame({ route, setRoute }) {
  return (
    <div className="relative rounded-[42px] p-3 shadow-[0_18px_60px_-12px_rgba(0,0,0,.25)]" style={{ background: '#0a0908' }}>
      <div className="w-[390px] h-[800px] rounded-[34px] overflow-hidden bg-paper flex flex-col" style={{ background: '#fafaf7' }}>
        {/* Status bar */}
        <div className="flex items-center justify-between px-7 pt-3 pb-2 text-[12px] font-semibold text-stone-900">
          <span>9:41</span>
          <span className="text-[10px] tracking-wide">●●●● 5G ▮▮▮</span>
        </div>
        {/* Notch */}
        <div className="absolute top-[18px] left-1/2 -translate-x-1/2 w-[110px] h-[26px] rounded-full" style={{ background: '#0a0908' }} />

        {/* Content */}
        <div className="flex-1 overflow-hidden relative">
          {route === 'quick-add' && <QuickAddMobile />}
          {route !== 'quick-add' && <PlaceholderScreen route={route} />}
        </div>

        {/* Bottom tabs */}
        <div className="border-t border-stone-200 bg-white grid grid-cols-5">
          {MOBILE_TABS.map((t) => {
            const active = route === t.id;
            const Icon = t.icon;
            return (
              <button key={t.id} onClick={() => setRoute(t.id)}
              className="py-2 pb-3 flex flex-col items-center gap-[3px] transition">
                <span className={'w-9 h-7 flex items-center justify-center rounded-full ' + (active ? 'bg-stone-900 text-white' : 'text-stone-500')}>
                  <Icon width={t.id === 'quick-add' ? 17 : 16} height={t.id === 'quick-add' ? 17 : 16} />
                </span>
                <span className={'text-[10px] tracking-wide ' + (active ? 'text-stone-900 font-semibold' : 'text-stone-500 font-medium')}>{t.label}</span>
              </button>);

          })}
        </div>

        {/* Home indicator */}
        <div className="pb-2 flex justify-center"><div className="w-32 h-[5px] rounded-full bg-stone-900/80" /></div>
      </div>
    </div>);

}

// ─── Desktop shell: side rail ────────────────────────────────────────────
const DESKTOP_NAV = [
{ id: 'quick-add', icon: I.plus, label: 'Quick Add', kbd: 'A' },
{ id: 'expenses', icon: I.list, label: 'Expenses', kbd: 'E' },
{ id: 'dashboard', icon: I.chart, label: 'Dashboard', kbd: 'D' },
{ id: 'receipt', icon: I.receipt, label: 'Receipt', kbd: 'R' },
{ id: 'settings', icon: I.cog, label: 'Settings', kbd: ',' }];


function DesktopFrame({ route, setRoute }) {
  return (
    <div className="w-[1280px] h-[820px] rounded-2xl border border-stone-300 overflow-hidden bg-white shadow-[0_18px_60px_-16px_rgba(0,0,0,.25)] flex">
      {/* Side rail */}
      <aside className="w-[232px] border-r border-stone-200 flex flex-col" style={{ background: '#f2efe8' }}>
        <div className="px-5 pt-6 pb-4">
          <div className="flex items-center gap-2">
            <div className="w-7 h-7 rounded-md flex items-center justify-center text-white font-bold text-[13px]" style={{ background: '#0a0908' }}>L</div>
            <div>
              <div className="text-[14px] font-bold tracking-tight">Ledger</div>
              <div className="text-[10.5px] text-stone-500 -mt-0.5">personal · IDR</div>
            </div>
          </div>
        </div>
        <nav className="px-3 flex flex-col gap-[2px]">
          {DESKTOP_NAV.map((n) => {
            const active = route === n.id;
            const Icon = n.icon;
            return (
              <button key={n.id} onClick={() => setRoute(n.id)}
              className={'group flex items-center gap-2.5 px-3 py-[7px] rounded-lg text-[13px] transition ' + (active ? 'bg-stone-900 text-white font-semibold' : 'text-stone-700 hover:bg-stone-200/60 font-medium')}>
                <Icon width={15} height={15} />
                <span className="flex-1 text-left">{n.label}</span>
                <span className={'text-[10px] font-mono px-1.5 py-px rounded border ' + (active ? 'border-white/30 text-white/70' : 'border-stone-300 text-stone-400 group-hover:text-stone-500')}>⌘{n.kbd}</span>
              </button>);

          })}
        </nav>

        <div className="mt-auto px-4 pb-5">
          <div className="rounded-xl border border-stone-300 bg-white p-3.5">
            <div className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">Net owed to you</div>
            <div className="mt-1 font-mono text-[22px] font-bold tracking-tight">{fmtIDR(487500)}</div>
            <div className="text-[10.5px] text-stone-500 mt-0.5">Early {fmtIDR(680000)} − Unpaid {fmtIDR(192500)}</div>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main className="flex-1 flex flex-col overflow-hidden">
        {route === 'quick-add' && <QuickAddDesktop />}
        {route !== 'quick-add' && <PlaceholderScreen route={route} desktop />}
      </main>
    </div>);

}

function PlaceholderScreen({ route, desktop }) {
  const titles = { expenses: 'Expenses', dashboard: 'Dashboard', receipt: 'Receipt export', settings: 'Settings' };
  return (
    <div className={'h-full flex flex-col items-center justify-center text-center ' + (desktop ? 'p-12' : 'p-6')}>
      <div className="text-[11px] uppercase tracking-wider text-stone-400 font-semibold">Pass 1 · upcoming</div>
      <div className="mt-1 text-[26px] font-bold tracking-tight">{titles[route]}</div>
      <div className="mt-2 text-[13px] text-stone-500 max-w-sm leading-relaxed">
        Designed in the wireframes — being elevated to this fidelity in the next turn.
        Switch device or screen above to navigate.
      </div>
    </div>);

}

// ─── Quick-Add (mobile) — dense grid + tap-to-keypad on amount ────────────
const RECENT_CATS = ['c2', 'c1', 'c5', 'c6', 'c9']; // last-used (top of grid)
const RECENT_METHODS = ['m4', 'm3', 'm6', 'm1', 'm2', 'm5'];

function QuickAddMobile() {
  const [raw, setRaw] = useState('');
  const [keypad, setKeypad] = useState(false);
  const [catId, setCatId] = useState('c2');
  const [methId, setMethId] = useState('m4');
  const [statusId, setStatusId] = useState('s1');
  const [desc, setDesc] = useState('');
  const evalRes = evalFormula(raw);
  const cat = CATEGORIES.find((c) => c.id === catId);
  const meth = METHODS.find((m) => m.id === methId);
  const status = STATUSES.find((s) => s.id === statusId);

  return (
    <div className="h-full flex flex-col">
      {/* Header */}
      <header className="px-5 pt-3 pb-3 border-b border-stone-200 bg-paper" style={{ background: '#fafaf7' }}>
        <div className="flex items-baseline justify-between">
          <div>
            <div className="text-[11px] text-stone-500 font-medium">Mon · 11 May 2026</div>
            <h1 className="text-[22px] font-bold tracking-tight">New expense</h1>
          </div>
          <button className="text-[12px] text-stone-500 font-medium">Cancel</button>
        </div>
      </header>

      <div className="flex-1 overflow-y-auto px-5 pb-5 pt-4 flex flex-col gap-4">
        {/* Amount card */}
        <button onClick={() => setKeypad(true)} className="text-left rounded-2xl border-2 border-stone-900 bg-white px-4 py-3 active:scale-[.99] transition">
          <div className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">Amount</div>
          <div className="flex items-baseline gap-2 mt-0.5">
            <span className="text-[14px] font-mono text-stone-500">Rp</span>
            <span className="text-[34px] font-mono font-bold tracking-tight leading-none">
              {evalRes.ok && raw ? fmtIDR(evalRes.value).replace('Rp ', '') : '0'}
            </span>
          </div>
          {raw && raw.startsWith('=') &&
          <div className="text-[11px] font-mono text-stone-500 mt-1">{raw}</div>
          }
        </button>

        {/* Category */}
        <Section label="Category">
          <ChipPicker tokens={CATEGORIES} order={RECENT_CATS} value={catId} onChange={setCatId} />
        </Section>

        {/* Method */}
        <Section label="Method">
          <ChipPicker tokens={METHODS} order={RECENT_METHODS} value={methId} onChange={setMethId} />
        </Section>

        {/* Description */}
        <Section label="Description">
          <input value={desc} onChange={(e) => setDesc(e.target.value)}
          placeholder="e.g. Grab to office (team)"
          className="w-full px-3.5 py-3 rounded-xl border border-stone-300 bg-white text-[14px] outline-none focus:border-stone-900 focus:ring-2 focus:ring-stone-900/10 transition" />
        </Section>

        {/* Status + Date row */}
        <div className="grid grid-cols-[1.4fr_1fr] gap-3">
          <Section label="Reimbursement">
            <SelectStub><Chip token={status} size="md" /></SelectStub>
          </Section>
          <Section label="Date">
            <SelectStub><span className="text-[13px] font-medium">Today</span></SelectStub>
          </Section>
        </div>

        <div className="text-[11px] text-stone-400 mt-1">Press <kbd className="px-1.5 py-0.5 rounded border border-stone-300 text-[10px] font-mono">⏎</kbd> from description to save & refocus amount.</div>
      </div>

      {/* Save bar */}
      <div className="border-t border-stone-200 bg-white px-5 py-3 flex gap-2">
        <button className="flex-[1] py-3 rounded-xl border border-stone-300 text-[14px] font-semibold text-stone-700">Cancel</button>
        <button className="flex-[2] py-3 rounded-xl text-[14px] font-semibold text-white" style={{ background: '#0a0908' }}>Save expense</button>
      </div>

      {/* Keypad sheet */}
      <KeypadSheet open={keypad} onClose={() => setKeypad(false)} value={raw} onChange={setRaw} evalRes={evalRes} />
    </div>);

}

function Section({ label, children }) {
  return (
    <div>
      <div className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-1.5">{label}</div>
      {children}
    </div>);

}

function SelectStub({ children }) {
  return (
    <button className="w-full px-3 py-2.5 rounded-xl border border-stone-300 bg-white flex items-center justify-between text-left">
      <span className="min-w-0 truncate">{children}</span>
      <I.chev width={14} height={14} className="text-stone-400 flex-shrink-0" />
    </button>);

}

function ChipPicker({ tokens, order, value, onChange }) {
  // Show order first, then everything else; selected gets a ring.
  const ordered = [...order.map((id) => tokens.find((t) => t.id === id)).filter(Boolean),
  ...tokens.filter((t) => !order.includes(t.id))];
  return (
    <div className="flex flex-wrap gap-1.5">
      {ordered.map((t) => {
        const sel = t.id === value;
        return (
          <button key={t.id} onClick={() => onChange(t.id)}
          className={'rounded-full p-[2px] transition ' + (sel ? 'ring-2 ring-stone-900 ring-offset-1 ring-offset-paper' : 'ring-0')} style={{ padding: "0px" }}>
            <Chip token={t} size="md" />
          </button>);

      })}
      <button className="rounded-full px-3 py-[5px] text-[12px] text-stone-500 border border-dashed border-stone-300 hover:border-stone-900 hover:text-stone-900 transition">+ new</button>
    </div>);

}

// ─── Keypad sheet ────────────────────────────────────────────────────────
const KEYS = [
['7', '8', '9', '÷'],
['4', '5', '6', '×'],
['1', '2', '3', '−'],
['.', '0', '⌫', '+']];

const KEY_MAP = { '÷': '/', '×': '*', '−': '-' };

function KeypadSheet({ open, onClose, value, onChange, evalRes }) {
  // Track formula mode (= prefix) and bare-number mode
  const press = (k) => {
    if (k === '⌫') return onChange(value.slice(0, -1));
    const ch = KEY_MAP[k] ?? k;
    // First operator/decimal: prepend = automatically (formula mode)
    let next = value;
    if (!next && /[+\-*/.]/.test(ch)) next = '=';
    if (next === '' && /\d/.test(ch)) {
      next = ch;
    } else if (next.startsWith('=')) {
      next = next + ch;
    } else if (/[+\-*/]/.test(ch)) {
      next = '=' + value + ch;
    } else {
      next = next + ch;
    }
    onChange(next);
  };
  const display = value && evalRes.ok ? fmtIDR(evalRes.value).replace('Rp ', '') : value || '0';

  if (!open) return null;
  return (
    <div className="absolute inset-0 z-30 flex flex-col justify-end" onClick={onClose}>
      <div className="absolute inset-0 bg-stone-900/30" />
      <div className="relative bg-white border-t border-stone-200 rounded-t-3xl shadow-2xl pb-3 animate-[slideUp_.2s_ease]" onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-center pt-2 pb-1"><div className="w-10 h-[5px] rounded-full bg-stone-300" /></div>
        {/* Display */}
        <div className="px-5 pt-2 pb-3 border-b border-stone-200">
          <div className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">Amount</div>
          <div className="flex items-baseline gap-2 mt-0.5">
            <span className="text-[15px] font-mono text-stone-500">Rp</span>
            <span className="text-[40px] font-mono font-bold tracking-tight leading-none">{display}</span>
          </div>
          {value.startsWith('=') && <div className="text-[12px] font-mono text-stone-500 mt-1">{value}{evalRes.err && <span className="text-rose-600 ml-2">· {evalRes.err}</span>}</div>}
        </div>
        {/* Keys */}
        <div className="grid grid-cols-4 gap-2 px-3 pt-3">
          {KEYS.flat().map((k) =>
          <button key={k} onClick={() => press(k)}
          className={'h-14 rounded-2xl text-[20px] font-semibold font-mono border transition active:scale-95 ' + (
          /[÷×−+⌫]/.test(k) ? 'bg-stone-100 border-stone-200 text-stone-700' : 'bg-white border-stone-200 text-stone-900 hover:bg-stone-50')}>
              {k}
            </button>
          )}
        </div>
        <div className="px-3 pt-3 pb-1 flex gap-2">
          <button onClick={() => onChange('')} className="flex-1 h-12 rounded-2xl text-[13px] font-semibold text-stone-700 border border-stone-200 bg-stone-50">Clear</button>
          <button onClick={onClose} className="flex-[2] h-12 rounded-2xl text-[14px] font-semibold text-white" style={{ background: '#0a0908' }}>Done</button>
        </div>
      </div>
      <style>{`@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}`}</style>
    </div>);

}

// ─── Quick-Add (desktop) — same model, two-column ────────────────────────
function QuickAddDesktop() {
  const [raw, setRaw] = useState('=26000*3');
  const [keypad, setKeypad] = useState(false);
  const [catId, setCatId] = useState('c2');
  const [methId, setMethId] = useState('m4');
  const [statusId, setStatusId] = useState('s2');
  const [desc, setDesc] = useState('Grab to office (team)');
  const evalRes = evalFormula(raw);
  const status = STATUSES.find((s) => s.id === statusId);

  return (
    <div className="h-full flex flex-col overflow-hidden">
      <header className="px-8 py-5 border-b border-stone-200 flex items-baseline justify-between flex-shrink-0">
        <div>
          <div className="text-[11.5px] uppercase tracking-wider text-stone-500 font-semibold">Quick Add</div>
          <h1 className="text-[28px] font-bold tracking-tight mt-0.5">Record an expense</h1>
        </div>
        <div className="text-[12px] text-stone-500">
          Today is <span className="font-semibold text-stone-900">Mon, 11 May 2026</span>
        </div>
      </header>

      <div className="flex-1 overflow-y-auto px-8 py-6">
        <div className="max-w-[860px] grid grid-cols-[1.4fr_1fr] gap-6">
          {/* Left column: amount + description + status + date */}
          <div className="flex flex-col gap-4">
            <div className="relative">
              <Section label="Amount">
                <button onClick={() => setKeypad((v) => !v)}
                className="w-full rounded-2xl border-2 border-stone-900 bg-white px-5 py-4 text-left transition hover:bg-stone-50">
                  <div className="flex items-baseline gap-3">
                    <span className="text-[15px] font-mono text-stone-500">Rp</span>
                    <span className="text-[42px] font-mono font-bold tracking-tight leading-none">
                      {evalRes.ok && raw ? fmtIDR(evalRes.value).replace('Rp ', '') : '0'}
                    </span>
                  </div>
                  {raw.startsWith('=') &&
                  <div className="text-[12px] font-mono text-stone-500 mt-1.5">{raw}</div>
                  }
                </button>
              </Section>
              {keypad &&
              <div className="absolute left-0 top-full mt-2 w-[320px] rounded-2xl bg-white border border-stone-200 shadow-2xl z-20 p-3">
                  <div className="grid grid-cols-4 gap-2">
                    {KEYS.flat().map((k) =>
                  <button key={k} onClick={() => {
                    if (k === '⌫') return setRaw((r) => r.slice(0, -1));
                    const ch = KEY_MAP[k] ?? k;
                    setRaw((r) => {
                      if (!r && /[+\-*/.]/.test(ch)) return '=' + ch;
                      if (r === '' && /\d/.test(ch)) return ch;
                      if (r.startsWith('=')) return r + ch;
                      if (/[+\-*/]/.test(ch)) return '=' + r + ch;
                      return r + ch;
                    });
                  }}
                  className={'h-12 rounded-xl text-[16px] font-semibold font-mono border transition active:scale-95 ' + (
                  /[÷×−+⌫]/.test(k) ? 'bg-stone-100 border-stone-200 text-stone-700' : 'bg-white border-stone-200 text-stone-900 hover:bg-stone-50')}>
                        {k}
                      </button>
                  )}
                  </div>
                  <div className="flex gap-2 mt-2">
                    <button onClick={() => setRaw('')} className="flex-1 h-10 rounded-xl text-[12px] font-semibold text-stone-600 border border-stone-200 bg-stone-50">Clear</button>
                    <button onClick={() => setKeypad(false)} className="flex-[2] h-10 rounded-xl text-[13px] font-semibold text-white" style={{ background: '#0a0908' }}>Done</button>
                  </div>
                </div>
              }
            </div>
            <Section label="Description">
              <input value={desc} onChange={(e) => setDesc(e.target.value)}
              placeholder="What was it for?"
              className="w-full px-4 py-3 rounded-xl border border-stone-300 bg-white text-[14px] outline-none focus:border-stone-900 focus:ring-2 focus:ring-stone-900/10 transition" />
            </Section>
            <div className="grid grid-cols-2 gap-3">
              <Section label="Reimbursement">
                <SelectStub><Chip token={status} size="md" /></SelectStub>
              </Section>
              <Section label="Date">
                <button className="w-full px-3 py-2.5 rounded-xl border border-stone-300 bg-white flex items-center justify-between text-left">
                  <span className="flex items-center gap-2 text-[13px] font-medium"><I.cal width={14} height={14} className="text-stone-500" />Today · 11 May</span>
                  <I.chev width={14} height={14} className="text-stone-400" />
                </button>
              </Section>
            </div>
          </div>

          {/* Right column: chips */}
          <div className="flex flex-col gap-4">
            <Section label="Category">
              <ChipPicker tokens={CATEGORIES} order={RECENT_CATS} value={catId} onChange={setCatId} />
            </Section>
            <Section label="Method">
              <ChipPicker tokens={METHODS} order={RECENT_METHODS} value={methId} onChange={setMethId} />
            </Section>
            <div className="text-[11.5px] text-stone-500 leading-relaxed border-l-2 border-stone-300 pl-3 py-1 mt-1">
              Per-field <span className="font-semibold text-stone-700">last-used memory</span> orders these chips. Selection ring on the active one; "+ new" creates inline (Milestone I).
            </div>
          </div>
        </div>
      </div>

      <div className="border-t border-stone-200 bg-white px-8 py-3.5 flex items-center justify-between flex-shrink-0">
        <div className="text-[11.5px] text-stone-500">
          <kbd className="px-1.5 py-0.5 rounded border border-stone-300 font-mono text-[10px] mr-1">⏎</kbd>
          save & start another
          <span className="mx-3 text-stone-300">·</span>
          <kbd className="px-1.5 py-0.5 rounded border border-stone-300 font-mono text-[10px] mr-1">⎋</kbd>
          cancel
        </div>
        <div className="flex gap-2">
          <button className="px-4 py-2 rounded-lg border border-stone-300 text-[13px] font-semibold text-stone-700">Cancel</button>
          <button className="px-5 py-2 rounded-lg text-[13px] font-semibold text-white" style={{ background: '#0a0908' }}>Save expense</button>
        </div>
      </div>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
