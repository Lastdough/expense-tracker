// Selected-chip rendering style options:
//   'ring'    : current ring outline (clunky baseline)
//   'bigger'  : scale + bold the selected chip
//   'darker'  : darken bg, bold the selected chip
//   'both'    : bigger AND darker
//   'invert'  : bigger + bold + swap fg/bg, original bg becomes a border ON the chip
//   'halo'    : bigger + bold + fg-color border ON the chip (no color swap)
const TweaksCtx = createContext({ selStyle: 'invert' });

function darkenHex(hex, amt = 0.18) {
  const h = (hex || '#000000').replace('#','');
  if (h.length !== 6) return hex;
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  const f = (v) => Math.max(0, Math.round(v * (1 - amt)));
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2,'0')).join('');
}
function lightenHex(hex, amt = 0.35) {
  const h = (hex || '#000000').replace('#','');
  if (h.length !== 6) return hex;
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  const f = (v) => Math.min(255, Math.round(v + (255 - v) * amt));
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2,'0')).join('');
}
// Perceived luminance (0–1)
function lum(hex) {
  const h = (hex || '#000000').replace('#','');
  if (h.length !== 6) return 0.5;
  const r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
  return 0.299*r + 0.587*g + 0.114*b;
}
// Smart halo: contrasts with BOTH the chip and the paper background.
// - Light chip (fg darker than bg): use fg as halo — a darker outline.
// - Dark chip  (fg lighter than bg): use a lightened bg as halo — mid-tone that
//   still reads against the paper. Pure fg (white) would melt into paper.
function haloColor(token) {
  return lum(token.fg) > lum(token.bg) ? lightenHex(token.bg, 0.42) : token.fg;
}

// ─── Formula eval (display-only, mirrors the security rules) ─────────────
function evalFormula(raw) {
  if (!raw) return { ok: false, value: 0 };
  const expr = raw.startsWith('=') ? raw.slice(1) : raw;
  if (!/^[\d+\-*/().\s]*$/.test(expr)) return { ok: false, value: 0, err: 'invalid characters' };
  try {
    // eslint-disable-next-line no-new-func
    // Real app uses sandboxed parser — this preview just renders the resolved number.
    // Whitelist already enforced above; we'll do a tiny shunting-yard.
    return { ok: true, value: shuntingYard(expr) };
  } catch (e) {return { ok: false, value: 0, err: e.message };}
}
function shuntingYard(s) {
  const out = [],op = [],prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
  const tokens = s.match(/(\d+\.?\d*|[+\-*/()])/g) || [];
  for (const t of tokens) {
    if (/^\d/.test(t)) out.push(parseFloat(t));else
    if (t === '(') op.push(t);else
    if (t === ')') {while (op.length && op[op.length - 1] !== '(') out.push(op.pop());op.pop();} else
    {while (op.length && op[op.length - 1] !== '(' && prec[op[op.length - 1]] >= prec[t]) out.push(op.pop());op.push(t);}
  }
  while (op.length) out.push(op.pop());
  const st = [];
  for (const t of out) {
    if (typeof t === 'number') st.push(t);else
    {const b = st.pop(),a = st.pop();st.push(t === '+' ? a + b : t === '-' ? a - b : t === '*' ? a * b : a / b);}
  }
  return st[0] ?? 0;
}

function ChipPicker({ tokens, order, value, onChange }) {
  const { selStyle } = useContext(TweaksCtx);
  const ordered = [...order.map((id) => tokens.find((t) => t.id === id)).filter(Boolean),
  ...tokens.filter((t) => !order.includes(t.id))];
  return (
    <div className="flex flex-wrap gap-1.5 items-center">
      {ordered.map((t) => {
        const sel = t.id === value;
        const useRing   = sel && selStyle === 'ring';
        const useBigger = sel && (selStyle === 'bigger' || selStyle === 'both' || selStyle === 'invert' || selStyle === 'halo');
        const useDarken = sel && (selStyle === 'darker' || selStyle === 'both');
        const useInvert = sel && selStyle === 'invert';
        const useHalo   = sel && selStyle === 'halo';
        let bg = t.bg, fg = t.fg, borderColor = 'transparent';
        if (useInvert) { bg = t.fg; fg = t.bg; borderColor = t.bg; }
        else if (useHalo) { borderColor = haloColor(t); }
        else if (useDarken) { bg = darkenHex(t.bg, 0.22); }
        return (
          <button key={t.id} onClick={() => onChange(t.id)}
            className={'rounded-full transition-transform duration-150 ' + (useRing ? 'ring-2 ring-stone-900 ring-offset-1' : '')}
            style={{ padding: 0, transform: useBigger ? 'scale(1.10)' : 'scale(1)', margin: useBigger ? '0 4px' : '0', ['--tw-ring-offset-color']: '#fafaf7' }}>
            <span className={'inline-flex items-center rounded-full leading-tight whitespace-nowrap text-[12.5px] ' + ((useInvert || useHalo) ? 'px-[9px] py-[2px] border-2' : 'px-2.5 py-[3px]') + ' ' + (sel ? 'font-semibold' : 'font-medium')}
                  style={{ background: bg, color: fg, borderColor: (useInvert || useHalo) ? borderColor : undefined }}>
              {t.name}
            </span>
          </button>);

      })}
      <button className="rounded-full px-3 py-[5px] text-[12px] text-stone-500 border border-dashed border-stone-300 hover:border-stone-900 hover:text-stone-900 transition">+ new</button>
    </div>);

}

// ─── Keypad sheet ────────────────────────────────────────────────────────
const KEYS = [
['7', '8', '9', '÷'],
['4', '5', '6', '×'],
['1', '2', '3', '−'],
['.', '0', '⌫', '+']];

const KEY_MAP = { '÷': '/', '×': '*', '−': '-' };

function KeypadSheet({ open, onClose, value, onChange, evalRes }) {
  // Track formula mode (= prefix) and bare-number mode
  const press = (k) => {
    if (k === '⌫') return onChange(value.slice(0, -1));
    const ch = KEY_MAP[k] ?? k;
    // First operator/decimal: prepend = automatically (formula mode)
    let next = value;
    if (!next && /[+\-*/.]/.test(ch)) next = '=';
    if (next === '' && /\d/.test(ch)) {
      next = ch;
    } else if (next.startsWith('=')) {
      next = next + ch;
    } else if (/[+\-*/]/.test(ch)) {
      next = '=' + value + ch;
    } else {
      next = next + ch;
    }
    onChange(next);
  };
  const display = value && evalRes.ok ? fmtIDR(evalRes.value).replace('Rp ', '') : value || '0';

  if (!open) return null;
  return (
    <div className="absolute inset-0 z-30 flex flex-col justify-end" onClick={onClose}>
      <div className="absolute inset-0 bg-stone-900/30" />
      <div className="relative bg-white border-t border-stone-200 rounded-t-3xl shadow-2xl pb-3 animate-[slideUp_.2s_ease]" onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-center pt-2 pb-1"><div className="w-10 h-[5px] rounded-full bg-stone-300" /></div>
        {/* Display */}
        <div className="px-5 pt-2 pb-3 border-b border-stone-200">
          <div className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">Amount</div>
          <div className="flex items-baseline gap-2 mt-0.5">
            <span className="text-[15px] font-mono text-stone-500">Rp</span>
            <span className="text-[40px] font-mono font-bold tracking-tight leading-none">{display}</span>
          </div>
          {value.startsWith('=') && <div className="text-[12px] font-mono text-stone-500 mt-1">{value}{evalRes.err && <span className="text-rose-600 ml-2">· {evalRes.err}</span>}</div>}
        </div>
        {/* Keys */}
        <div className="grid grid-cols-4 gap-2 px-3 pt-3">
          {KEYS.flat().map((k) =>
          <button key={k} onClick={() => press(k)}
          className={'h-14 rounded-2xl text-[20px] font-semibold font-mono border transition active:scale-95 ' + (
          /[÷×−+⌫]/.test(k) ? 'bg-stone-100 border-stone-200 text-stone-700' : 'bg-white border-stone-200 text-stone-900 hover:bg-stone-50')}>
              {k}
            </button>
          )}
        </div>
        <div className="px-3 pt-3 pb-1 flex gap-2">
          <button onClick={() => onChange('')} className="flex-1 h-12 rounded-2xl text-[13px] font-semibold text-stone-700 border border-stone-200 bg-stone-50">Clear</button>
          <button onClick={onClose} className="flex-[2] h-12 rounded-2xl text-[14px] font-semibold text-white" style={{ background: '#0a0908' }}>Done</button>
        </div>
      </div>
      <style>{`@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}`}</style>
    </div>);

}

  const d = new Date(iso);

};

function buildHistory(e) {
  const out = [
    { label:'Expense created', when:'11 May · 09:14', detail:'Logged via Quick Add on iPhone.' },
  ];
  if (['s2','s3','s4','s5'].includes(e.statusId)) {
    out.push({ label:'Status changed', when:'11 May · 09:14', from:getStatus('s1'), to:getStatus('s2') });
  }
  if (e.statusId === 's5') {
    out.push({ label:'Submitted to finance', when:'12 May · 16:30', detail:'Receipts attached. Awaiting approval.', from:getStatus('s2'), to:getStatus('s5') });
  }
  if (e.statusId === 's4') {
    out.push({ label:'Marked early reimbursement', when:'10 May · 11:02', detail:'Will be reimbursed in next payroll cycle.', from:getStatus('s2'), to:getStatus('s4') });
  }
  if (e.statusId === 's3') {
    out.push({ label:'Submitted to finance', when:'9 May · 10:00', from:getStatus('s2'), to:getStatus('s5') });
    out.push({ label:'Paid', when:'9 May · 17:42', detail:'Reimbursed via payroll. Cleared.', from:getStatus('s5'), to:getStatus('s3') });
  }
  return out.reverse();
}

        <div className="absolute inset-0 z-30 flex flex-col justify-end">
          <div className="absolute inset-0 bg-stone-900/40" onClick={()=>setFiltersOpen(false)} />
          <div className="relative bg-white border-t border-stone-200 rounded-t-3xl shadow-2xl max-h-[80%] flex flex-col animate-[slideUp_.22s_ease]">
            <div className="flex justify-center pt-2 pb-1"><div className="w-10 h-[5px] rounded-full bg-stone-300" /></div>
            <div className="px-5 pb-4 overflow-y-auto">
              <div className="text-[15px] font-bold tracking-tight mb-3">Filter receipt</div>
              <div className="text-[10.5px] uppercase tracking-wider text-stone-500 font-semibold mb-2">Status</div>
              <div className="flex flex-wrap gap-1.5 mb-4">
                {STATUSES.map(s => {
                  const on = statusIds.includes(s.id);
                  return (
                    <button key={s.id} onClick={()=>toggle(s.id)} className={'rounded-full transition ' + (on ? 'opacity-100' : 'opacity-35')}>
                      <Chip token={s} label={s.short} size="md" />
                    </button>
                  );
                })}
              </div>
              <div className="text-[10.5px] uppercase tracking-wider text-stone-500 font-semibold mb-2">Group by</div>
              <div className="inline-flex rounded-lg border border-stone-300 bg-white p-[2px] w-full">
                {[['status','Status'],['category','Category'],['none','None']].map(([k,l]) => (
                  <button key={k} onClick={()=>setGrouping(k)}
                    className={'flex-1 px-2 py-2 text-[12px] rounded-md font-medium transition ' + (grouping===k ? 'bg-stone-900 text-white' : 'text-stone-500')}>
                    {l}
                  </button>
                ))}
              </div>
              <button onClick={()=>setFiltersOpen(false)} className="w-full mt-5 py-3 rounded-xl text-[13px] font-semibold text-white" style={{ background:'#0a0908' }}>Apply</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Mobile: Settings (tabs at top, full-bleed tab content) ─────────────
function SettingsMobile() {
  const [tab, setTab] = useState('categories');
  return (
    <div className="h-full flex flex-col">
      <header className="px-5 pt-3 pb-2 border-b border-stone-200 bg-paper flex-shrink-0" style={{ background:'#fafaf7' }}>
        <div className="text-[10.5px] uppercase tracking-wider text-stone-500 font-semibold">Settings</div>
        <h1 className="text-[20px] font-bold tracking-tight">Reference data</h1>
        <div className="mt-2 flex gap-1">
          {SETTINGS_TABS.map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={()=>setTab(t.id)}
                className={'flex-1 px-2 py-1.5 text-[11.5px] font-semibold border-b-2 -mb-px flex items-center justify-center gap-1.5 transition ' +
                  (active ? 'border-stone-900 text-stone-900' : 'border-transparent text-stone-500')}>
                {t.label.split(' ')[0]}
                <span className={'text-[10px] font-mono px-1 rounded ' + (active ? 'bg-stone-900 text-white' : 'bg-stone-200 text-stone-600')}>{t.count}</span>
              </button>
            );
          })}
        </div>
      </header>

      <div className="flex-1 overflow-y-auto px-3 py-3">
        {tab === 'categories' && (
          <div className="flex flex-col gap-2">
            {CATEGORIES.map(c => (
              <div key={c.id} className="rounded-xl border border-stone-200 bg-white p-3 flex items-center gap-3">
                <DragHandle />
                <Chip token={c} size="md" />
                <div className="flex-1"></div>
                <div className="flex gap-1">
                  <span className="w-5 h-5 rounded border border-stone-200" style={{ background: c.bg }} />
                  <span className="w-5 h-5 rounded border border-stone-200" style={{ background: c.fg }} />
                </div>
                <I.chev width={12} height={12} className="text-stone-300 rotate-[-90deg]" />
              </div>
            ))}
            <button className="rounded-xl border-2 border-dashed border-stone-300 text-stone-500 py-3 text-[12.5px] font-medium">+ New category</button>
          </div>
        )}
        {tab === 'methods' && (
          <div className="grid grid-cols-2 gap-2">
            {METHODS.map(m => (
              <div key={m.id} className="rounded-xl border border-stone-200 bg-white overflow-hidden">
                <div className="h-[60px] flex items-center justify-center" style={{ background: m.bg }}>
                  <span className="text-[14px] font-semibold tracking-tight" style={{ color: m.fg }}>{m.name}</span>
                </div>
                <div className="px-2.5 py-2 flex items-center justify-between">
                  <div className="flex gap-1">
                    <span className="w-4 h-4 rounded border border-stone-200" style={{ background: m.bg }} />
                    <span className="w-4 h-4 rounded border border-stone-200" style={{ background: m.fg }} />
                  </div>
                  <DragHandle />
                </div>
              </div>
            ))}
            <button className="rounded-xl border-2 border-dashed border-stone-300 text-stone-500 min-h-[100px] text-[12.5px] font-medium flex items-center justify-center">+ New</button>
          </div>
        )}
        {tab === 'statuses' && (
          <div className="flex flex-col gap-2">
            {STATUSES.map(s => (
              <div key={s.id} className="rounded-xl border border-stone-200 bg-white p-3 flex items-center gap-3">
                <DragHandle />
                <Chip token={s} label={s.short} size="md" />
                <div className="flex-1 text-[11px] text-stone-500 truncate">{s.name}</div>
                <I.chev width={12} height={12} className="text-stone-300 rotate-[-90deg]" />
              </div>
            ))}
            <button className="rounded-xl border-2 border-dashed border-stone-300 text-stone-500 py-3 text-[12.5px] font-medium">+ New status</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
