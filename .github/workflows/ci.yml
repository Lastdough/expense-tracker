name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup reads `packageManager` from
      # package.json (pnpm@10.11.1), the same source corepack uses in the
      # Dockerfiles. One pinned version, no drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generate the Prisma client so tsc/vitest/build can resolve
      # `@prisma/client` types. Defaults to the sqlite schema and needs no
      # database connection — `generate` reads the schema, it doesn't connect.
      # DATABASE_URL is still required: prisma.config.ts resolves env('DATABASE_URL')
      # at load time and errors if unset. A dummy sqlite URL satisfies it.
      - name: Generate Prisma client
        env:
          DATABASE_URL: file:./ci.db
        run: pnpm --filter server db:generate

      - name: Enforce dependency rule (CLAUDE.md)
        run: pnpm lint:deps

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Build + push the two decoupled images to GHCR. Runs on a disposable
  # GitHub-hosted runner — nothing here needs the private network.
  images:
    needs: check
    # Only publish from main. PRs run check only — no image pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name for GHCR automatically.
          images: ghcr.io/${{ github.repository_owner }}/expense-tracker-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
